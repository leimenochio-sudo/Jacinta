<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
</head>
<body>
    <header>
        <nav>
            <a href="../index.html">Inicio</a>
        </nav>
    </header>

    <main>
        <h1>Para contactarnos</h1>
        <p>jacinta@gmail.com</p>
        <p>Completá el formulario para escribirnos.</p>

        <form method="get">
            <div>
                <label for="nombre">Tu nombre:</label>
                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    required
                >
            </div>

            <div>
                <label for="email">Correo electrónico:</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >
            </div>

            <div>
                <label for="mensaje">Mensaje:</label>
                <textarea
                    id="mensaje"
                    name="mensaje"
                    rows="5"
                    required
                ></textarea>
            </div>

            <button type="submit">Enviar</button>
        </form>
    </main>
</body>
</html>
